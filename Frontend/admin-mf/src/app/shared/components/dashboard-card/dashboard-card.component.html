<div class="dashboard-card">
  <div class="card-header">
    <h2>{{ title }}</h2>

    <div class="icon-box">
      <svg *ngIf="iconType === 'calendar'" width="58" height="58" viewBox="0 0 64 64" fill="none">
        <rect x="9" y="13" width="46" height="40" rx="8" stroke="#4f55dd" stroke-width="5"/>
        <path d="M9 25H55" stroke="#4f55dd" stroke-width="5"/>
        <path d="M21 7V17" stroke="#4f55dd" stroke-width="5" stroke-linecap="round"/>
        <path d="M43 7V17" stroke="#4f55dd" stroke-width="5" stroke-linecap="round"/>
        <circle cx="22" cy="36" r="2.5" fill="#4f55dd"/>
        <circle cx="32" cy="36" r="2.5" fill="#4f55dd"/>
        <circle cx="42" cy="36" r="2.5" fill="#4f55dd"/>
        <circle cx="22" cy="45" r="2.5" fill="#4f55dd"/>
        <circle cx="32" cy="45" r="2.5" fill="#4f55dd"/>
        <circle cx="42" cy="45" r="2.5" fill="#4f55dd"/>
      </svg>

      <svg *ngIf="iconType === 'clock'" width="58" height="58" viewBox="0 0 64 64" fill="none">
        <rect x="11" y="11" width="42" height="42" rx="12" stroke="#51995a" stroke-width="5"/>
        <path d="M32 22V34H43" stroke="#51995a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <svg *ngIf="iconType === 'swap'" width="58" height="58" viewBox="0 0 64 64" fill="none">
        <path d="M18 22H48" stroke="#8e44ad" stroke-width="5" stroke-linecap="round"/>
        <path d="M40 14L50 22L40 30" stroke="#8e44ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M46 42H16" stroke="#8e44ad" stroke-width="5" stroke-linecap="round"/>
        <path d="M24 34L14 42L24 50" stroke="#8e44ad" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="card-content">
    <div class="count">{{ count }}</div>
    <button>View all</button>
  </div>
</div>

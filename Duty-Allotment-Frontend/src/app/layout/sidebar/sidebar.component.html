<aside class="w-[72px] h-full bg-white border-r border-[#ECEEF2] flex flex-col items-center justify-between pt-[34px] pb-[18px]">

  <!-- Faculty sidebar -->
  <nav *ngIf="!isAdminRoute()" class="flex flex-col items-center gap-[28px]">

    <a
  routerLink="/dashboard"
  routerLinkActive="bg-black text-white"
  [routerLinkActiveOptions]="{ exact: true }"
  class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]"
>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="5" height="5" rx="1"></rect>
    <rect x="13" y="4" width="5" height="5" rx="1"></rect>
    <rect x="4" y="13" width="5" height="5" rx="1"></rect>
    <path d="M15.5 13v6"></path>
    <path d="M12.5 16h6"></path>
  </svg>
</a>

    <a routerLink="/assigned-duties" routerLinkActive="bg-black text-white"
       class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="3.5"></circle>
        <path d="M5 20c0-3.8 3-6 7-6s7 2.2 7 6"></path>
      </svg>
    </a>

    <a routerLink="/swap-request" routerLinkActive="bg-black text-white"
       class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4l4 4-4 4"></path>
        <path d="M4 8h16"></path>
        <path d="M8 20l-4-4 4-4"></path>
        <path d="M20 16H4"></path>
      </svg>
    </a>

    <a routerLink="/duty-history" routerLinkActive="bg-black text-white"
       class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="8"></circle>
        <path d="M12 7v5l3 2"></path>
      </svg>
    </a>

  </nav>

  <!-- Admin sidebar -->
  <nav *ngIf="isAdminRoute()" class="flex flex-col items-center gap-[28px]">

    <a
  routerLink="/admin-dashboard"
  routerLinkActive="bg-black text-white"
  [routerLinkActiveOptions]="{ exact: true }"
  class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]"
>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="5" height="5" rx="1"></rect>
    <rect x="13" y="4" width="5" height="5" rx="1"></rect>
    <rect x="4" y="13" width="5" height="5" rx="1"></rect>
    <path d="M15.5 13v6"></path>
    <path d="M12.5 16h6"></path>
  </svg>
</a>

    <!-- Three heads / three bodies -->
    <a
  routerLink="/faculty-management"
  routerLinkActive="bg-black text-white"
  class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#6F7D96]"
>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="7" r="3.2" stroke="currentColor" stroke-width="2"/>
    <circle cx="6" cy="9" r="2.4" stroke="currentColor" stroke-width="2"/>
    <circle cx="18" cy="9" r="2.4" stroke="currentColor" stroke-width="2"/>

    <path
      d="M8.5 18.5C8.5 15.8 10 14.2 12 14.2C14 14.2 15.5 15.8 15.5 18.5"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M2.8 17.5C2.8 15.5 4.2 14.3 6 14.3C7 14.3 7.8 14.7 8.4 15.4"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M21.2 17.5C21.2 15.5 19.8 14.3 18 14.3C17 14.3 16.2 14.7 15.6 15.4"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</a>

    <a routerLink="/create-duty" routerLinkActive="bg-black text-white"
       class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="4" y="4" width="16" height="16" rx="3"></rect>
        <path d="M12 8v8"></path>
        <path d="M8 12h8"></path>
      </svg>
    </a>

    <a
  routerLink="/assign-duty"
  routerLinkActive="bg-black text-white"
  class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#6F7D96]"
>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <circle
      cx="10"
      cy="8"
      r="3.2"
      stroke="currentColor"
      stroke-width="2"
    />

    <path
      d="M4.5 18C4.5 15.2 6.7 13.5 10 13.5C13.3 13.5 15.5 15.2 15.5 18"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M19 7V13"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M16 10H22"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</a>

    <a routerLink="/admin-swap-request" routerLinkActive="bg-black text-white"
       class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#8091AA]">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4l4 4-4 4"></path>
        <path d="M4 8h16"></path>
        <path d="M8 20l-4-4 4-4"></path>
        <path d="M20 16H4"></path>
      </svg>
    </a>

    <a
  routerLink="/duty-records"
  routerLinkActive="bg-black text-white"
  class="w-[36px] h-[36px] rounded-[6px] flex items-center justify-center text-[#6F7D96]"
>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
    <path
      d="M8 3H15L19 7V19C19 20.1 18.1 21 17 21H8C6.9 21 6 20.1 6 19V5C6 3.9 6.9 3 8 3Z"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <path
      d="M15 3V7H19"
      stroke="currentColor"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <path
      d="M10 13H15"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />

    <path
      d="M10 17H13"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</a>

  </nav>

  <button class="w-[36px] h-[36px] flex items-center justify-center text-black">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M10 3H5a2 2 0 00-2 2v14a2 2 0 002 2h5v-3H6V6h4V3z"></path>
      <path d="M15 7l5 5-5 5v-3H9v-4h6V7z"></path>
    </svg>
  </button>

</aside>

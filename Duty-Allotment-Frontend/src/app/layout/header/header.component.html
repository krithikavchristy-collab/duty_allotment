<header class="h-[54px] bg-white border-b border-[#e5e7eb] flex items-center justify-between px-[18px]">

  <div class="w-[180px] flex items-center">
    <img src="assets/images/usys-logo.jpeg" alt="USYS" class="w-[75px] h-auto" />
  </div>

  <div class="flex-1 flex justify-center">
    <img src="assets/images/kju-logo.jpeg" alt="KJU" class="h-[34px] object-contain" />
  </div>

  <div class="w-[270px] flex items-center justify-end gap-[18px]">

    <!-- Bell -->
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8091AA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 01-3.46 0"></path>
    </svg>

    <!-- Correct settings icon -->
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8091AA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15.5A3.5 3.5 0 1112 8a3.5 3.5 0 010 7.5z"></path>
      <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l2.11-1.65a.5.5 0 00.12-.64l-2-3.46a.5.5 0 00-.6-.22l-2.49 1a7.28 7.28 0 00-1.69-.98L14.5 2.42A.5.5 0 0014 2h-4a.5.5 0 00-.5.42L9.12 5.07c-.6.23-1.17.56-1.69.98l-2.49-1a.5.5 0 00-.6.22l-2 3.46a.5.5 0 00.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.02.66.07.98l-2.11 1.65a.5.5 0 00-.12.64l2 3.46c.13.23.4.32.64.22l2.49-1c.52.4 1.08.74 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.6-.24 1.17-.57 1.69-.98l2.49 1c.24.1.51.01.64-.22l2-3.46a.5.5 0 00-.12-.64l-2.11-1.65z"></path>
    </svg>

    <!-- Faculty -->
    <div *ngIf="!isAdminRoute()" class="h-[34px] w-[150px] bg-white border border-black rounded-full flex items-center gap-[7px] px-[7px] text-black">
      <div class="w-[26px] h-[26px] rounded-full bg-black flex items-center justify-center text-white text-[11px] font-bold">
        SJ
      </div>
      <div class="leading-[11px]">
        <p class="text-[11px] font-bold whitespace-nowrap">Dr. Sarah Jacob</p>
        <p class="text-[8px] font-medium whitespace-nowrap">Department of CS</p>
      </div>
    </div>

    <!-- Admin -->
    <div *ngIf="isAdminRoute()" class="h-[34px] w-[140px] bg-white border border-black rounded-full flex items-center gap-[10px] px-[10px] text-black">
      <div class="w-[18px] h-[18px] rounded-full bg-[#1D0606]"></div>
      <p class="text-[14px] font-bold whitespace-nowrap">Abin Xavier</p>
    </div>

  </div>

</header>

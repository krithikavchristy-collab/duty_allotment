<section class="min-h-full bg-[#fafafd] px-[32px] pt-[28px] pb-[80px]">

  <div class="w-[735px]">

    <!-- Title + Add Faculty -->
    <div class="flex items-center justify-between mb-[18px]">
      <h1 class="text-[13px] font-semibold text-[#111827]">
        Faculty Management
      </h1>

      <button class="h-[31px] px-[14px] bg-[#2563EB] text-white text-[11px] font-medium rounded-[6px] shadow-md">
        + Add Faculty
      </button>
    </div>

    <!-- Table Card -->
    <div class="w-[735px] h-[565px] bg-white border border-[#E5E7EB] rounded-[10px] overflow-hidden shadow-sm">

      <!-- Search + Filter -->
      <div class="h-[55px] flex items-center justify-between px-[14px] border-b border-[#E5E7EB]">

        <div class="w-[190px] h-[30px] border border-[#E5E7EB] rounded-[6px] flex items-center px-[10px] bg-white">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="#A8B1C2" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M20 20l-4.5-4.5"></path>
          </svg>

          <input
            type="text"
            placeholder="Search Faculty..."
            class="ml-[8px] w-full bg-transparent outline-none text-[10px] text-[#6B7280] placeholder:text-[#B8C0CC]"
          />
        </div>

        <button class="h-[30px] px-[13px] border border-[#DADDE3] rounded-[6px] flex items-center gap-[7px] text-[10px] text-[#6B7280] bg-white">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="#8B95A7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 5h18l-7 8v5l-4 2v-7L3 5z"></path>
          </svg>
          Filters
        </button>

      </div>

      <!-- Header -->
      <div class="h-[42px] bg-[#F8FAFC] border-b border-[#E5E7EB] grid grid-cols-[45px_95px_135px_150px_130px_105px_75px] items-center px-[14px] text-[9px] font-bold tracking-[0.08em] uppercase text-[#6B7280]">
        <div>
          <input type="checkbox" class="w-[13px] h-[13px]" />
        </div>
        <div>EMP ID</div>
        <div>Faculty Name</div>
        <div>Department</div>
        <div>Designation</div>
        <div>Status</div>
        <div>Actions</div>
      </div>

      <!-- Row 1 -->
      <div class="h-[42px] border-b border-[#EEF0F4] grid grid-cols-[45px_95px_135px_150px_130px_105px_75px] items-center px-[14px] text-[10px] text-[#374151]">
        <input type="checkbox" class="w-[13px] h-[13px]" />
        <div>EMP 011</div>
        <div class="font-bold text-black">Dr. John</div>
        <div>Computer Science</div>
        <div class="font-bold text-black">Professor</div>
        <div>
          <span class="px-[7px] py-[2px] rounded-[5px] border border-[#FDBA74] text-[#EA580C] bg-[#FFF7ED] text-[9px]">
            On Leave
          </span>
        </div>
        <div class="flex items-center gap-[10px] text-[#9CA3AF]">
          <span>⊙</span><span>↗</span><span>⌫</span><span>⋮</span>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="h-[42px] border-b border-[#EEF0F4] grid grid-cols-[45px_95px_135px_150px_130px_105px_75px] items-center px-[14px] text-[10px] text-[#374151]">
        <input type="checkbox" class="w-[13px] h-[13px]" />
        <div>EMP 015</div>
        <div class="font-bold text-black">Kevin</div>
        <div>Computer Science</div>
        <div class="font-bold text-black">Professor</div>
        <div>
          <span class="px-[7px] py-[2px] rounded-[5px] border border-[#FDBA74] text-[#EA580C] bg-[#FFF7ED] text-[9px]">
            On Leave
          </span>
        </div>
        <div class="flex items-center gap-[10px] text-[#9CA3AF]">
          <span>⊙</span><span>↗</span><span>⌫</span><span>⋮</span>
        </div>
      </div>

      <!-- Active Rows -->
      <ng-container *ngFor="let row of [
        {id:'EMP 022', name:'Mary'},
        {id:'EMP 023', name:'Mary'},
        {id:'EMP 024', name:'Mary'},
        {id:'EMP 025', name:'Mary'},
        {id:'EMP 026', name:'Mary'},
        {id:'EMP 027', name:'Mary'},
        {id:'EMP 028', name:'Mary'},
        {id:'EMP 029', name:'Mary'}
      ]">
        <div class="h-[42px] border-b border-[#EEF0F4] grid grid-cols-[45px_95px_135px_150px_130px_105px_75px] items-center px-[14px] text-[10px] text-[#374151]">
          <input type="checkbox" class="w-[13px] h-[13px]" />
          <div>{{ row.id }}</div>
          <div class="font-bold text-black">{{ row.name }}</div>
          <div>Computer Science</div>
          <div class="font-bold text-black">Professor</div>
          <div>
            <span class="px-[8px] py-[2px] rounded-[5px] border border-[#60A5FA] text-[#2563EB] bg-white text-[9px]">
              Active
            </span>
          </div>
          <div class="flex items-center gap-[10px] text-[#9CA3AF]">
            <span>⊙</span><span>↗</span><span>⌫</span><span>⋮</span>
          </div>
        </div>
      </ng-container>

      <!-- Footer Pagination -->
      <div class="h-[47px] flex items-center justify-between px-[14px] border-t border-[#E5E7EB]">

        <div class="flex items-center gap-[8px] text-[10px] text-[#6B7280]">
          <span>Rows per page</span>
          <select class="w-[38px] h-[24px] border border-[#E5E7EB] rounded-[5px] bg-white text-black text-[10px] px-[4px]">
            <option>10</option>
          </select>
        </div>

        <div class="flex items-center gap-[12px] text-[10px] text-[#6B7280]">
          <span>1 - 10 of 25</span>
          <span class="text-[#CBD5E1]">‹</span>
          <span class="w-[22px] h-[22px] bg-[#2563EB] text-white rounded-[5px] flex items-center justify-center shadow">
            1
          </span>
          <span>2</span>
          <span>3</span>
          <span>›</span>
        </div>

      </div>

    </div>

  </div>

</section>

<section class="min-h-full bg-[#fafafd]">

  <!-- Tab Navigation -->
  <div class="border-b border-gray-200 bg-white px-6">
    <div class="flex items-center gap-1">

      <!-- Dashboard Tab -->
      <button
        (click)="setTab('dashboard')"
        class="flex flex-col items-start px-6 py-4 min-w-[160px] rounded-t-md transition-colors"
        [ngClass]="activeTab === 'dashboard'
          ? 'bg-blue-600 text-white'
          : 'text-gray-500 hover:text-gray-700'"
      >
        <span class="text-sm font-semibold">Dashboard</span>
        <span class="text-[10px] mt-0.5"
          [ngClass]="activeTab === 'dashboard' ? 'text-blue-100' : 'text-gray-400'">
          Quick view and calendar
        </span>
      </button>

      <!-- Assigned Duties Tab -->
      <button
        (click)="setTab('assigned')"
        class="flex flex-col items-start px-6 py-4 min-w-[190px] rounded-t-md transition-colors"
        [ngClass]="activeTab === 'assigned'
          ? 'bg-blue-600 text-white'
          : 'text-gray-500 hover:text-gray-700'"
      >
        <span class="text-sm font-semibold">Assigned Duties</span>
        <span class="text-[10px] mt-0.5"
          [ngClass]="activeTab === 'assigned' ? 'text-blue-100' : 'text-gray-400'">
          Today's duties and Upcoming Duties
        </span>
      </button>

      <!-- Swap Duties Tab -->
      <button
        (click)="setTab('swap')"
        class="flex flex-col items-start px-6 py-4 min-w-[160px] rounded-t-md transition-colors"
        [ngClass]="activeTab === 'swap'
          ? 'bg-blue-600 text-white'
          : 'text-gray-500 hover:text-gray-700'"
      >
        <span class="text-sm font-semibold">Swap Duties</span>
        <span class="text-[10px] mt-0.5"
          [ngClass]="activeTab === 'swap' ? 'text-blue-100' : 'text-gray-400'">
          Request swap and View request
        </span>
      </button>

      <!-- Duty History Tab -->
      <button
        (click)="setTab('history')"
        class="flex flex-col items-start px-6 py-4 min-w-[160px] rounded-t-md transition-colors"
        [ngClass]="activeTab === 'history'
          ? 'bg-blue-600 text-white'
          : 'text-gray-500 hover:text-gray-700'"
      >
        <span class="text-sm font-semibold">Duty History</span>
        <span class="text-[10px] mt-0.5"
          [ngClass]="activeTab === 'history' ? 'text-blue-100' : 'text-gray-400'">
          View previous Duties
        </span>
      </button>

    </div>
  </div>

  <!-- Page Content -->
  <div class="px-8 pt-6 pb-10">

    <!-- Dashboard Tab Content -->
    <div *ngIf="activeTab === 'dashboard'">

      <!-- Three Cards Row -->
      <div class="flex items-start gap-5">

        <!-- Assigned Duties Card -->
        <div class="w-[240px] h-[160px] bg-white border border-[#e5e7eb] rounded-[8px] shadow-sm px-5 pt-4">
          <div class="flex items-center justify-between">
            <h3 class="text-[14px] font-medium text-black">Assigned Duties</h3>
            <svg class="w-[28px] h-[28px]" viewBox="0 0 48 48" fill="none">
              <rect x="7" y="9" width="34" height="32" rx="6" stroke="#000" stroke-width="4"/>
              <path d="M7 18H41" stroke="#000" stroke-width="4" stroke-linecap="round"/>
              <path d="M16 5V12M32 5V12" stroke="#000" stroke-width="4" stroke-linecap="round"/>
              <circle cx="16" cy="26" r="2" fill="#000"/>
              <circle cx="24" cy="26" r="2" fill="#000"/>
              <circle cx="32" cy="26" r="2" fill="#000"/>
              <circle cx="16" cy="34" r="2" fill="#000"/>
              <circle cx="24" cy="34" r="2" fill="#000"/>
              <circle cx="32" cy="34" r="2" fill="#000"/>
            </svg>
          </div>
          <div class="mt-5">
            <p class="text-[42px] font-light leading-none text-black">00</p>
          </div>
        </div>

        <!-- Upcoming Duties Card -->
        <div class="w-[240px] h-[160px] bg-white border border-[#e5e7eb] rounded-[8px] shadow-sm px-5 pt-4">
          <div class="flex items-center justify-between">
            <h3 class="text-[14px] font-medium text-black">Upcoming Duties</h3>
            <svg class="w-[28px] h-[28px]" viewBox="0 0 48 48" fill="none">
              <rect x="6" y="6" width="36" height="36" rx="10" stroke="#000" stroke-width="4"/>
              <path d="M24 15V25L31 30" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="mt-5">
            <p class="text-[42px] font-light leading-none text-black">00</p>
          </div>
        </div>

        <!-- Swap Request Card -->
        <div class="w-[240px] h-[160px] bg-white border border-[#e5e7eb] rounded-[8px] shadow-sm px-5 pt-4">
          <div class="flex items-center justify-between">
            <h3 class="text-[14px] font-medium text-black">Swap Request</h3>
            <svg class="w-[28px] h-[28px]" viewBox="0 0 64 64" fill="none">
              <path d="M12 21H48" stroke="#000" stroke-width="4" stroke-linecap="round"/>
              <path d="M39 12L50 21L39 30" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M52 43H16" stroke="#000" stroke-width="4" stroke-linecap="round"/>
              <path d="M25 34L14 43L25 52" stroke="#000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="mt-5">
            <p class="text-[42px] font-light leading-none text-black">00</p>
          </div>
        </div>

      </div>

      <!-- Calendar -->
      <div class="mt-6 w-[300px] bg-white border border-[#e5e7eb] rounded-[8px] shadow-sm px-7 pt-5 pb-5">

        <div class="flex items-center justify-between mb-5">
          <h2 class="text-[15px] font-bold text-black">October 2020</h2>
          <div class="flex gap-3 text-gray-500 cursor-pointer select-none">
            <span class="hover:text-blue-600">‹</span>
            <span class="hover:text-blue-600">›</span>
          </div>
        </div>

        <!-- Day Headers -->
        <div class="grid grid-cols-7 text-[12px] font-medium text-black text-center mb-3">
          <span>Mo</span>
          <span>Tu</span>
          <span>We</span>
          <span>Th</span>
          <span>Fr</span>
          <span>Sa</span>
          <span>Su</span>
        </div>

        <!-- Date Grid -->
        <div class="grid grid-cols-7 gap-y-3 text-[12px] text-[#555] text-center items-center">
          <span></span><span></span><span></span>
          <span>1</span><span>2</span><span>3</span><span>4</span>

          <span>5</span><span>6</span><span>7</span>
          <span class="w-[26px] h-[26px] bg-[#2563eb] text-white rounded-full flex items-center justify-center mx-auto">8</span>
          <span>9</span><span>10</span><span>11</span>

          <span>12</span><span>13</span><span>14</span>
          <span>15</span><span>16</span><span>17</span><span>18</span>

          <span>19</span><span>20</span><span>21</span>
          <span>22</span><span>23</span><span>24</span><span>25</span>

          <span>26</span><span>27</span><span>28</span>
          <span>29</span><span>30</span><span>31</span><span></span>
        </div>

      </div>

    </div>
    <!-- /Dashboard Tab -->

    <!-- Assigned Duties Tab Content (placeholder) -->
    <div *ngIf="activeTab === 'assigned'">
      <p class="text-sm text-gray-500">Assigned Duties content goes here.</p>
    </div>

    <!-- Swap Duties Tab Content (placeholder) -->
    <div *ngIf="activeTab === 'swap'">
      <p class="text-sm text-gray-500">Swap Duties content goes here.</p>
    </div>

    <!-- Duty History Tab Content (placeholder) -->
    <div *ngIf="activeTab === 'history'">
      <p class="text-sm text-gray-500">Duty History content goes here.</p>
    </div>

  </div>

</section>

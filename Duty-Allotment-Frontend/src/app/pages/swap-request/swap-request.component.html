<section class="min-h-full bg-[#fafafd] px-8 pt-7">

  <!-- Page Title -->
  <h1 class="text-2xl font-semibold text-gray-900 mb-6">Duty Swap</h1>

  <!-- Tabs -->
  <div class="flex items-center gap-2 mb-8">
    <a routerLink="/swap-request"
       class="px-5 py-2 rounded-md text-sm font-medium bg-blue-600 text-white">
      Request New Swap
    </a>
    <a routerLink="/received-request"
       class="px-5 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-700">
      Received Request
    </a>
  </div>

  <hr class="border-gray-200 mb-8">

  <!-- My Duty + Swap Icon + Swap With -->
  <div class="flex items-center gap-6 mb-6">

    <!-- My Duty Card -->
    <div class="w-[300px] border border-gray-200 rounded-xl bg-white p-4">
      <p class="text-sm font-semibold text-gray-700 mb-3">My Duty</p>
      <div class="flex items-center gap-3">
        <!-- duty icon -->
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <rect x="18" y="8" width="28" height="48" rx="8" stroke="#374151" stroke-width="4"/>
          <path d="M26 20H38M26 32H38M26 44H34" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span class="text-sm font-semibold text-gray-800">Interview Duty</span>
      </div>
      <div class="flex items-center gap-2 mt-3">
        <!-- calendar icon -->
        <svg width="16" height="16" viewBox="0 0 64 64" fill="none">
          <rect x="10" y="14" width="44" height="42" rx="8" stroke="#6B7280" stroke-width="4"/>
          <path d="M10 26H54" stroke="#6B7280" stroke-width="4"/>
          <path d="M22 8V18M42 8V18" stroke="#6B7280" stroke-width="4"/>
        </svg>
        <div>
          <p class="text-xs font-semibold text-gray-700">Date/time</p>
          <p class="text-xs text-gray-500">21 - May - 2026</p>
          <p class="text-xs text-gray-500">10:00 AM - 11:00 PM</p>
        </div>
      </div>
    </div>

    <!-- Swap Icon -->
    <svg width="32" height="32" viewBox="0 0 64 64" fill="none">
      <path d="M14 22H48" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 12L52 22L40 32" stroke="#374151" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 43H16" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
      <path d="M24 33L12 43L24 53" stroke="#374151" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- Swap With Card -->
    <div class="w-[300px] border border-gray-200 rounded-xl bg-white p-4">
      <p class="text-sm font-semibold text-gray-700 mb-3">Swap With</p>
      <label class="text-xs text-gray-500 mb-1 block">Select Faculty</label>
      <select class="w-full border border-gray-300 rounded-md px-3 py-1.5 text-sm text-gray-500 bg-white outline-none focus:ring-1 focus:ring-blue-400">
        <option value="">Choose Faculty Member</option>
      </select>
    </div>

  </div>

  <!-- Reason for Swap Request -->
  <div class="w-[630px] border border-gray-200 rounded-xl bg-white p-4">
    <p class="text-sm font-semibold text-gray-700 mb-3">Reason for Swap Request</p>
    <textarea
      rows="4"
      class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm text-gray-600 resize-none outline-none focus:ring-1 focus:ring-blue-400 bg-gray-50"
      placeholder="Enter the Reason for Requesting Swap...">
    </textarea>
    <div class="flex justify-end mt-3">
      <button class="px-6 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 transition-colors">
        Submit
      </button>
    </div>
  </div>

</section>

<section class="min-h-full bg-[#fafafd] px-[88px] pt-[28px]">

  <h1 class="text-[42px] font-bold text-black">
    Swap Request
  </h1>

  <div class="mt-[110px] flex items-center gap-[45px]">

    <!-- Left Card -->
    <div class="w-[600px] h-[225px] bg-white border border-[#e5e7eb] rounded-[16px] shadow-sm flex items-start px-[26px] pt-[28px]">

      <img
        src="assets/images/image1.jpg"
        alt="Faculty"
        class="w-[58px] h-[58px] rounded-full object-cover mt-[4px]"
      />

      <div class="ml-[24px]">
        <h2 class="text-[26px] font-bold text-[#1f2937]">
          Bonnie Green
        </h2>

        <div class="mt-[12px] text-[20px] leading-[28px] text-[#475569]">
          <div>Exam Duty - 22 May 2026</div>
          <div>9:00 AM -12:00 PM</div>
          <div>Block A 101</div>
          <div>Reason : I have a meeting</div>
          <div>Requested on 18 May 2026</div>
        </div>
      </div>

    </div>

    <!-- Swap Icon -->
    <div class="w-[70px] flex justify-center text-[#1d3765]">
      <svg width="52" height="52" viewBox="0 0 64 64" fill="none">
        <path d="M14 22H48" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 12L52 22L40 32" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 43H16" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 33L12 43L24 53" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Right Card -->
    <div class="w-[575px] h-[215px] bg-white border border-[#e5e7eb] rounded-[16px] shadow-sm flex items-start px-[26px] pt-[30px] relative">

      <img
        src="assets/images/image2.jpg"
        alt="Faculty"
        class="w-[58px] h-[58px] rounded-full object-cover"
      />

      <div class="ml-[24px]">
        <h2 class="text-[26px] font-bold text-[#1f2937]">
          John
        </h2>

        <p class="mt-[8px] text-[23px] text-[#475569]">
          Requested With
        </p>
      </div>

      <div class="absolute right-[52px] bottom-[22px] flex gap-[76px]">
        <button class="w-[100px] h-[54px] bg-[#0aa000] text-white rounded-[10px] text-[18px]">
          Accept
        </button>

        <button class="w-[100px] h-[54px] bg-[#c00000] text-white rounded-[10px] text-[18px]">
          Reject
        </button>
      </div>

    </div>

  </div>

  <!-- Pagination -->
  <div class="mt-[315px] ml-[24px] w-[1265px] border-t border-gray-200"></div>

  <div class="mt-[24px] ml-[24px] w-[1265px] flex items-center justify-between text-[14px] text-gray-500">

    <div class="flex items-center gap-3">
      <span>Rows per page</span>

      <button class="w-[66px] h-[34px] bg-white border border-gray-200 rounded-[8px] text-black">
        10⌄
      </button>
    </div>

    <div class="flex items-center gap-5">
      <span>1 - 10 of 25</span>
      <span class="text-gray-300">‹</span>

      <span class="w-[34px] h-[34px] bg-blue-600 text-white rounded-[9px] flex items-center justify-center shadow-lg">
        1
      </span>

      <span class="text-gray-700">2</span>
      <span class="text-gray-700">3</span>
      <span class="text-gray-300">›</span>
    </div>

  </div>

</section>

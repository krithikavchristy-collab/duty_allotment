<section class="min-h-full bg-[#fafafd] px-8 pt-6">

  <!-- Title -->
  <p class="text-sm text-gray-600 mb-4">Swap Request</p>

  <!-- Swap Request List -->
  <div class="flex flex-col gap-4">

    <div *ngFor="let item of swapRequests" class="flex items-center gap-3">

      <!-- Left Card -->
      <div class="w-[340px] bg-white border border-[#e5e7eb] rounded-[16px] shadow-sm flex items-start px-4 py-4">
        <img
          [src]="item.requester.image"
          alt="Faculty"
          class="w-10 h-10 rounded-full object-cover mt-1 shrink-0"
        />
        <div class="ml-3">
          <h2 class="text-sm font-semibold text-[#1f2937]">{{ item.requester.name }}</h2>
          <div class="mt-1 text-xs leading-5 text-[#475569]">
            <div>{{ item.requester.duty }}</div>
            <div>{{ item.requester.time }}</div>
            <div>{{ item.requester.block }}</div>
            <div>Reason : {{ item.requester.reason }}</div>
            <div>Requested on {{ item.requester.requestedOn }}</div>
          </div>
        </div>
      </div>

      <!-- Swap Icon -->
      <div class="flex justify-center items-center text-gray-400 shrink-0">
        <svg width="22" height="22" viewBox="0 0 64 64" fill="none">
          <path d="M14 22H48" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <path d="M40 12L52 22L40 32" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M50 43H16" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <path d="M24 33L12 43L24 53" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- Right Card -->
      <div class="w-[280px] bg-white border border-[#e5e7eb] rounded-[16px] shadow-sm flex flex-col px-4 py-4 min-h-[112px]">
        <div class="flex items-center gap-3">
          <img
            [src]="item.requestedWith.image"
            alt="Faculty"
            class="w-10 h-10 rounded-full object-cover shrink-0"
          />
          <div>
            <h2 class="text-sm font-semibold text-[#1f2937]">{{ item.requestedWith.name }}</h2>
            <p class="text-xs text-[#475569]">Requested With</p>
          </div>
        </div>

        <div class="flex justify-end gap-2 mt-4">
          <button class="px-4 py-1.5 bg-[#0aa000] text-white text-xs rounded-lg hover:bg-green-700 transition-colors">
            Accept
          </button>
          <button class="px-4 py-1.5 bg-[#c00000] text-white text-xs rounded-lg hover:bg-red-800 transition-colors">
            Reject
          </button>
        </div>
      </div>

    </div>

  </div>

  <!-- Pagination -->
<div class="mt-10 border-t border-gray-200"></div>

<div class="mt-4 grid grid-cols-3 items-center text-sm text-gray-500">

  <!-- Left: Rows per page -->
  <div class="flex items-center gap-2">
    <span>Rows per page</span>
    <select class="border border-gray-200 rounded-lg px-2 py-1 text-sm text-gray-700 bg-white focus:outline-none">
      <option>10</option>
      <option>25</option>
      <option>50</option>
    </select>
  </div>

  <!-- Center: Page numbers -->
  <div class="flex items-center justify-center gap-2">
    <button class="w-6 h-6 flex items-center justify-center text-gray-300 hover:text-gray-500">‹</button>
    <button class="w-7 h-7 bg-blue-600 text-white rounded-lg flex items-center justify-center text-sm shadow">1</button>
    <button class="w-7 h-7 text-gray-600 hover:text-gray-900 text-sm">2</button>
    <button class="w-7 h-7 text-gray-600 hover:text-gray-900 text-sm">3</button>
    <button class="w-6 h-6 flex items-center justify-center text-gray-500 hover:text-gray-700">›</button>
  </div>

  <!-- Right: Page info -->
  <div class="flex justify-end">
    <span>1 - 10 of 25</span>
  </div>

</div>

</section>

<section class="min-h-full bg-[#fafafd] px-[86px] pt-[34px] pb-[80px]">

  <h1 class="text-[20px] font-medium text-black mb-[42px]">
    Assigned Duties
  </h1>

  <!-- Search -->
  <div class="flex justify-end mb-[16px] pr-[5px]">
    <div class="w-[178px] h-[25px] bg-white border border-[#E1E5EC] rounded-[4px] flex items-center px-[9px]">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
           stroke="#A8B1C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-4.5-4.5"></path>
      </svg>

      <input
        type="text"
        placeholder="Search configuration..."
        class="ml-[7px] w-full bg-transparent outline-none text-[8px] text-[#A8B1C2] placeholder:text-[#C3C9D4]"
      />
    </div>
  </div>

  <!-- Duty Card -->
<div class="w-full h-[74px] bg-white rounded-[10px] flex items-center px-[24px]">

  <!-- Duty Type -->
  <div class="flex items-center w-[35%]">

    <!-- Edit Duty Icon -->
    <svg
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#7A879D"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="shrink-0"
    >
      <path d="M14.5 4H9C5.5 4 4 5.5 4 9V15C4 18.5 5.5 20 9 20H15C18.5 20 20 18.5 20 15V9"></path>
      <path d="M20.2 5.8C21.2 6.8 21.2 8.4 20.2 9.4L13.7 15.9C13.4 16.2 12.8 16.5 12.4 16.6L9.6 17.3C8.6 17.6 7.9 16.9 8.2 15.9L8.9 13.1C9 12.7 9.3 12.1 9.6 11.8L16.1 5.3C17.1 4.3 18.7 4.3 19.7 5.3L20.2 5.8Z"></path>
    </svg>

    <span class="ml-[18px] text-[17px] font-bold text-black">
      Exam Duty
    </span>

  </div>

  <!-- Date Time -->
  <div class="flex items-start w-[30%]">

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#7A879D"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="mt-[2px] shrink-0"
    >
      <path d="M8 2V5"></path>
      <path d="M16 2V5"></path>

      <rect
        x="3"
        y="4"
        width="18"
        height="17"
        rx="4"
      ></rect>

      <path d="M3 9H21"></path>

      <circle
        cx="12"
        cy="15"
        r="3.5"
      ></circle>

      <path d="M12 13.5V15.3L13.5 16.2"></path>
    </svg>

    <div class="ml-[10px]">
      <div class="text-[16px] font-bold text-black leading-[18px]">
        Date/time
      </div>

      <div class="text-[14px] text-black leading-[18px] mt-[4px]">
        21 - May - 2026
      </div>

      <div class="text-[14px] text-black leading-[18px]">
        10:00 AM - 11:00 PM
      </div>
    </div>

  </div>

  <!-- Location -->
  <div class="flex items-start w-[25%]">

    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#7A879D"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="mt-[2px]"
    >
      <path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12z"></path>
      <circle cx="12" cy="9" r="2.5"></circle>
    </svg>

    <div class="ml-[10px]">
      <div class="text-[16px] font-bold text-black leading-[18px]">
        Location
      </div>

      <div class="text-[14px] text-black leading-[18px] mt-[4px]">
        Admin block A
      </div>

      <div class="text-[14px] text-black leading-[18px]">
        302
      </div>
    </div>

  </div>

  <!-- Status -->
  <div class="flex justify-end flex-1">
    <span class="text-[14px] font-semibold text-black">
      Assigned
    </span>
  </div>

</div>

</section>

<section class="min-h-full bg-[#fafafd] px-[42px] pt-[32px]">

  <div class="flex justify-between items-start pr-[190px]">
    <div>
      <h1 class="text-[42px] font-bold text-[#202020] leading-none">
        Create&nbsp; New Duty
      </h1>

      <p class="text-[21px] text-gray-400 mt-[22px]">
        Fill in the details to create a new duty or event.
      </p>
    </div>

    <button class="mt-[42px] w-[122px] h-[48px] bg-blue-600 text-white rounded-[10px] text-[18px] shadow-lg">
      +&nbsp; Upload
    </button>
  </div>

  <div class="mt-[22px] grid grid-cols-2 gap-x-[180px] gap-y-[32px] w-[1010px] ml-[25px]">

    <div>
      <label class="block text-[22px] font-medium mb-[4px]">Duty Type</label>
      <div class="w-[370px] h-[54px] border border-gray-300 rounded-[9px] bg-white flex items-center justify-between px-[16px]">
        <span class="text-[20px] text-gray-400">Select&nbsp; a Duty Type...</span>
        <span class="text-[34px] text-gray-500 leading-none">⌄</span>
      </div>
    </div>

    <div>
      <label class="block text-[22px] font-medium mb-[2px]">Event</label>
      <div class="w-[360px] h-[23px] border border-gray-300 rounded-[12px] bg-white flex items-center px-[16px]">
        <span class="text-[19px] text-gray-400">e.g. End Semester Examination</span>
      </div>
    </div>

    <div>
      <label class="block text-[22px] font-medium mb-[7px]">Date</label>
      <div class="w-[373px] h-[64px] border border-gray-300 rounded-[10px] bg-white flex items-center justify-between px-[16px]">
        <span class="text-[22px] text-gray-400">DD/MM/YYYY</span>
        <span class="text-[34px] text-gray-500 leading-none">⌄</span>
      </div>
    </div>

    <div>
      <label class="block text-[22px] font-medium mb-[7px]">Time</label>
      <div class="w-[350px] h-[58px] border border-gray-300 rounded-[10px] bg-white flex items-center justify-between px-[16px]">
        <span class="text-[20px] text-gray-400">e.g.09:00 AM - 11:00 PM</span>
        <span class="text-[34px] text-gray-500 leading-none">⌄</span>
      </div>
    </div>

    <div>
      <label class="block text-[22px] font-medium mb-[7px]">Venue</label>
      <div class="w-[382px] h-[37px] border border-gray-300 rounded-[9px] bg-white flex items-center px-[16px]">
        <span class="text-[19px] text-gray-400">e.g. Block A -10</span>
      </div>
    </div>

    <div>
      <label class="block text-[22px] font-medium mb-[7px]">Department</label>
      <div class="w-[360px] h-[54px] border border-gray-300 rounded-[10px] bg-white flex items-center justify-between px-[16px]">
        <span class="text-[20px] text-gray-400">Select Department</span>
        <span class="text-[34px] text-gray-500 leading-none">⌄</span>
      </div>
    </div>

  </div>

  <div class="mt-[32px] ml-[67px]">
    <label class="block text-[22px] font-medium mb-[6px]">Description</label>

    <div class="w-[785px] h-[34px] border border-gray-300 rounded-[9px] bg-white flex items-center px-[16px]">
      <span class="text-[18px] text-gray-400">
        e.g. End Semester examination for CS-201 -DS
      </span>
    </div>
  </div>

  <div class="mt-[92px] flex justify-end gap-[70px] pr-[185px]">
    <button class="w-[80px] h-[38px] bg-white border border-gray-300 rounded-[8px] text-[16px]">
      Clear
    </button>

    <button class="w-[98px] h-[38px] bg-blue-600 text-white rounded-[8px] text-[16px] shadow-lg">
      Create
    </button>
  </div>

</section>

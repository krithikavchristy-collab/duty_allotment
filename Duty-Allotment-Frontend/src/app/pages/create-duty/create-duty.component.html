<section class="min-h-full bg-[#fafafd] px-10 pt-6">

  <!-- Breadcrumb / page label -->
  <p class="text-[13px] font-semibold text-gray-800 mb-0.5">Create New Duty</p>
  <p class="text-[12px] text-gray-400 mb-4">Fill in the details to create a new duty or event.</p>

  <!-- Card -->
  <div class="bg-white border border-gray-200 rounded-xl p-6 w-full max-w-[720px]">

    <!-- Card Header -->
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-[16px] font-semibold text-gray-800">Create &nbsp;New Duty</h2>
      <button class="bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-medium px-4 py-2 rounded-md shadow-sm">
        + Upload
      </button>
    </div>

    <!-- Form Grid -->
    <div class="grid grid-cols-2 gap-x-6 gap-y-4">

      <!-- Duty Type -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Duty Type</label>
        <div class="flex items-center justify-between border border-gray-300 rounded-md px-3 h-[36px] bg-white cursor-pointer">
          <span class="text-[13px] text-gray-400">Select a Duty Type</span>
          <i class="bi bi-chevron-down text-gray-400 text-[12px]"></i>
        </div>
      </div>

      <!-- Event Name -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Event Name</label>
        <input
          type="text"
          placeholder="e.g. End Semester Examination"
          class="w-full border border-gray-300 rounded-md px-3 h-[36px] text-[13px] text-gray-700 placeholder:text-gray-400 bg-white outline-none focus:border-blue-400"
        />
      </div>

      <!-- Date -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Date</label>
        <div class="flex items-center justify-between border border-gray-300 rounded-md px-3 h-[36px] bg-white cursor-pointer">
          <span class="text-[13px] text-gray-400">DD/MM/YYYY</span>
          <i class="bi bi-chevron-down text-gray-400 text-[12px]"></i>
        </div>
      </div>

      <!-- Time -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Time</label>
        <div class="flex items-center justify-between border border-gray-300 rounded-md px-3 h-[36px] bg-white cursor-pointer">
          <span class="text-[13px] text-gray-400">e.g. 9:00 AM - 11:00 AM</span>
          <i class="bi bi-chevron-down text-gray-400 text-[12px]"></i>
        </div>
      </div>

      <!-- Venue -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Venue</label>
        <input
          type="text"
          placeholder="e.g. Block A -10"
          class="w-full border border-gray-300 rounded-md px-3 h-[36px] text-[13px] text-gray-700 placeholder:text-gray-400 bg-white outline-none focus:border-blue-400"
        />
      </div>

      <!-- Department -->
      <div>
        <label class="block text-[13px] font-medium text-gray-700 mb-1">Department</label>
        <div class="flex items-center justify-between border border-gray-300 rounded-md px-3 h-[36px] bg-white cursor-pointer">
          <span class="text-[13px] text-gray-400">Select a Department</span>
          <i class="bi bi-chevron-down text-gray-400 text-[12px]"></i>
        </div>
      </div>

    </div>

    <!-- Description — full width -->
    <div class="mt-4">
      <label class="block text-[13px] font-medium text-gray-700 mb-1">Description</label>
      <textarea
        rows="4"
        placeholder="Brief description of the role and responsibilities..."
        class="w-full border border-gray-300 rounded-md px-3 py-2 text-[13px] text-gray-700 placeholder:text-gray-400 bg-white outline-none focus:border-blue-400 resize-none"
      ></textarea>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end gap-3 mt-5">
      <button class="px-5 py-2 border border-gray-300 rounded-md text-[13px] text-gray-600 bg-white hover:bg-gray-50">
        Clear
      </button>
      <button class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-[13px] font-medium shadow-sm">
        Create
      </button>
    </div>

  </div>

</section>
